[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app", "app.*", "broker", "broker.*", "strategy", "strategy.*", "engine", "engine.*", "database", "database.*", "state", "state.*", "reports", "reports.*", "utils", "utils.*"]

[project]
name = "ratio-spread-bot"
version = "0.1.0"
description = "Expiry Day Ratio Spread Algorithmic Trading System (Paper Trading)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "aiohttp>=3.9",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "protobuf>=5.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
    "types-protobuf>=5.26",
]

[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "broker.MarketDataFeed_pb2"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
